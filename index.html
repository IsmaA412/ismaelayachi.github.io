<!DOCTYPE html> <!--HTML TEST111-->
<html class="scroll-smooth" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Ismaël Ayachi - Portfolio</title>
  <meta content="Cityscapes & landscapes." name="description"/>
  <!-- Favicon -->
  <link href="dist/assets/favicon.ico" rel="icon" type="image/x-icon"/>
  <!-- Preload critical CSS -->
  <link href="dist/output.css" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link href="dist/output.css" rel="stylesheet"/></noscript>
  <link href="dist/gallery.css" rel="stylesheet"/>
  <!-- Les photos viennent de Cloudinary : ouvrir la connexion au plus tôt évite
       d'attendre DNS + TLS au moment où la première vignette est demandée. -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin/>
  <link rel="dns-prefetch" href="https://res.cloudinary.com"/>
  <!-- La liste des photos est demandée dès le parsing du <head>, sans attendre
       que gallery.js soit téléchargé et exécuté. -->
  <link rel="preload" href="photos.json" as="fetch" crossorigin/>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Signika:wght@400;700&display=swap" rel="stylesheet"/>
   <!-- Start - Fancybox Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
  <!-- Tailwind CSS -->
   <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      content: ["./dist/*.{html,js}"],
      theme: {
        extend:
                {
                  fontFamily: {
                    'nothingyoucoulddo': ['Nothing You Could Do', 'cursive'],
                    'signika': ['Signika', 'sans-serif'],
                  },
                },
      },
      plugins: [],
    }
  </script>


 </head>
 <body class="dark:bg-white bg-white h-screen text-black dark:text-black px-5 md:px-20 transition duration-500">
  <!-- Navbar -->
  <header class="flex w-full overflow-hidden pt-10 pb-1">
   <nav class="w-full" id="nav" role="navigation" x-data="{ open: false }">
    <div class="container mx-auto flex flex-wrap items-center md:flex-no-wrap">
     <div class="mr-4 md:mr-8">
      <a class="text-2xl font-signika font-bold" href="index.html">ISMAËL AYACHI</a>
     </div>
     <div class="ml-auto md:hidden flex items-center justify-start">
      <button @click="open = !open" class="tap-highlight-transparent text-black dark:text-white w-5 h-5 relative focus:outline-none" onclick="menuToggle()">
       <span class="sr-only">Open main menu</span>
       <div class="block w-5 absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2">
        <span :class="{'rotate-45': open,' -translate-y-1.5': !open }" aria-hidden="true" class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"></span>
        <span :class="{'opacity-0': open } " aria-hidden="true" class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"></span>
        <span :class="{'-rotate-45': open, ' translate-y-1.5': !open}" aria-hidden="true" class="block absolute h-0.5 w-5 bg-current transform transition duration-500 ease-in-out"></span>
       </div>
      </button>
     </div>
     <div class="w-full h-0 transition-all ease-out duration-500 md:transition-none md:w-auto md:flex-grow md:flex md:items-center" id="menu">
      <ul class="flex flex-col duration-300 ease-out md:space-x-5 sm:transition-none mt-5 md:flex-row md:items-center md:ml-auto md:mt-0 md:pt-0 md:border-0" id="ulMenu">
       <li class="group transition duration-300">
        <a class="font-signika text-2xl tap-highlight-transparent" href="index.html">
         PORTFOLIO
         <span class="hidden md:block h-0.5 bg-black dark:bg-white"></span>
        </a>
       </li>
       <li class="group transition duration-300">
        <a class="font-signika text-2xl tap-highlight-transparent" href="dist/contact.html">
         CONTACT
         <span class="hidden md:block max-w-0 group-hover:max-w-full transition-all duration-500 h-0.5 bg-black dark:bg-white"></span>
        </a>
       </li>
      </ul>
     </div>
    </div>
   </nav>
  </header>
  <!-- Content -->
  <div class="container mx-auto">
    <h1 class="text-4xl pt-10 pb-8 font-bold">PORTFOLIO</h1>
    <section class="text-neutral-700">
      <div class="container w-full">
         <!-- La grille est rendue par dist/gallery.js à partir de photos.json.
               Ajouter une photo = ajouter une entrée dans photos.json, rien à toucher ici. -->
          <div id="gallery" data-source="photos.json"></div>
          <noscript>
            <p class="gallery-error">Ce portfolio a besoin de JavaScript pour afficher les photos.</p>
          </noscript>
      </div>
    </section>
  </div>
  <!-- Footer -->
  <footer>
   <div class="max-w-screen-xl py-16 mx-auto">
    
      
    
    <p class="mt-8 text-xs text-gray-300 dark:text-gray-300 text-center">© 2025 ismaël ayachi</p>
   </div>
  </footer>
  <!-- gallery.js construit la grille puis initialise la lightbox lui-même :
       Fancybox doit être branché après l'insertion des vignettes. -->
  <script src="dist/gallery.js"></script>
  <script src="dist/menu.js"></script>
 </body>
</html>
